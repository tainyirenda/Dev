<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Offline • Afro Ubuntu TradeNet</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111827;background:#f8fafc}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:520px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    img{width:88px;height:88px;border-radius:20px}
    h1{margin:20px 0 8px;font-size:1.6rem}
    p{color:#6b7280;line-height:1.6}
    button{border:0;border-radius:10px;background:#111827;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="Afro Ubuntu TradeNet icon">
    <h1>You’re offline</h1>
    <p>The app shell is available, but dashboards, insights, chat, billing, reporting and account data require an internet connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
